# CI: corre los mismos sensores que el pre-push, pero server-side (no depende de que
# cada máquina instale el hook). Incluye el smoke REAL de Postgres contra un servicio,
# así la clase de bugs SQLite<->Postgres queda cubierta por ejecución, no solo guardas estáticos.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loveo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Activa el test_postgres_smoke (skipif sin esta var). Apunta al servicio de arriba.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loveo_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Preflight (secretos + ruff + pytest, incluido smoke Postgres)
        run: python scripts/preflight.py
